<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Terminal: $ whoami - Ivo Hradek, backend engineer and tech lead, Brno">
  <defs>
    <clipPath id="typing">
      <rect x="0" y="-24" width="0" height="32">
        <animate attributeName="width" from="0" to="120" begin="0.4s" dur="0.9s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title { fill: #8b949e; font-size: 13px; }
    .prompt { fill: #3fb950; font-size: 20px; }
    .cmd { fill: #e6edf3; font-size: 20px; }
    .out { fill: #e6edf3; font-size: 20px; }
    .dim { fill: #8b949e; font-size: 20px; }
    .accent { fill: #58a6ff; font-size: 20px; }
  </style>
  <rect x="0.5" y="0.5" width="899" height="229" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="899" height="36" rx="12" fill="#161b22"/>
  <rect x="0.5" y="24" width="899" height="13" fill="#161b22"/>
  <line x1="0.5" y1="36.5" x2="899.5" y2="36.5" stroke="#30363d"/>
  <circle cx="20" cy="18.5" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18.5" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18.5" r="6" fill="#27c93f"/>
  <text x="450" y="23" text-anchor="middle" class="title">ivo@brno: ~</text>

  <g transform="translate(32 84)">
    <text x="0" y="0" class="prompt">$</text>
    <g clip-path="url(#typing)">
      <text x="24" y="0" class="cmd">whoami</text>
    </g>
  </g>

  <g transform="translate(32 126)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.2s" fill="freeze"/>
    <text x="0" y="0" class="out">Ivo Hrádek</text>
    <text x="0" y="36" class="dim">backend engineer <tspan class="dim">·</tspan> tech lead <tspan class="dim">·</tspan> Brno, CZ</text>
  </g>

  <g transform="translate(32 204)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.1s" fill="freeze"/>
    <text x="0" y="0" class="prompt">$</text>
    <rect x="24" y="-16" width="11" height="20" fill="#e6edf3">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
