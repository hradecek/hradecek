# Renders GitHub metrics (incl. private contributions) into the metrics-renders branch.
# Needs the METRICS_TOKEN secret: a personal access token with the repo and read:user scopes.
name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics-renders
          filename: metrics.svg
          user: hradecek
          template: classic
          base: header, repositories
          repositories: 200
          repositories_batch: 25
          config_timezone: Europe/Prague
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
